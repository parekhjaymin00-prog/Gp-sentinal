<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="url(#bgGrad)"/>
  
  <!-- Outer Frame -->
  <rect x="15" y="15" width="1070" height="650" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="55" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="1">GUJARAT POLICE INNOVATION HACKATHON 2026</text>
  <text x="40" y="80" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Sentinel CCTV Grid &amp; Integrated Vehicle / Incident Intelligence Architecture</text>

  <!-- ROW 1: INGESTION & DISCONTINUITY -->
  <!-- Box 1: Sentinel Grid Ingestion -->
  <g transform="translate(40, 110)">
    <rect width="300" height="150" rx="10" fill="url(#boxGrad1)" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="32" rx="10" fill="#0369a1" fill-opacity="0.3"/>
    <text x="15" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. SENTINEL RTSP INGESTION</text>
    <text x="15" y="55" fill="#e2e8f0" font-family="monospace" font-size="12">• Transport: RTSP over TCP</text>
    <text x="15" y="75" fill="#e2e8f0" font-family="monospace" font-size="12">• Timing: CAP_PROP_POS_MSEC (PTS)</text>
    <text x="15" y="95" fill="#e2e8f0" font-family="monospace" font-size="12">• Backoff: 2.0s -> 30.0s Exp Multiplier</text>
    <text x="15" y="115" fill="#e2e8f0" font-family="monospace" font-size="12">• Memory-only (Zero raw footage write)</text>
    <text x="15" y="135" fill="#94a3b8" font-family="monospace" font-size="11">ResilientRTSPCapture &amp; live_capture.py</text>
  </g>

  <!-- Box 2: Discontinuity & Session Rotation -->
  <g transform="translate(390, 110)">
    <rect width="320" height="150" rx="10" fill="url(#boxGrad1)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="32" rx="10" fill="#b45309" fill-opacity="0.3"/>
    <text x="15" y="22" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. SCENE-CUT HARDENING</text>
    <text x="15" y="55" fill="#e2e8f0" font-family="monospace" font-size="12">• 64-bin Grayscale Hist Correlation</text>
    <text x="15" y="75" fill="#e2e8f0" font-family="monospace" font-size="12">• Discontinuity Threshold &lt; 0.70</text>
    <text x="15" y="95" fill="#e2e8f0" font-family="monospace" font-size="12">• Backward PTS Jump Check (Δ &lt; -500ms)</text>
    <text x="15" y="115" fill="#10b981" font-family="monospace" font-size="12">✓ Rotates TrackKey stream_session_id</text>
    <text x="15" y="135" fill="#94a3b8" font-family="monospace" font-size="11">SceneDiscontinuityDetector &amp; Session Isolated</text>
  </g>

  <!-- Box 3: AI Perception & Fusion -->
  <g transform="translate(760, 110)">
    <rect width="300" height="150" rx="10" fill="url(#boxGrad1)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="32" rx="10" fill="#047857" fill-opacity="0.3"/>
    <text x="15" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. PERCEPTION &amp; TEMPORAL FUSION</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="11">Incident Detectors (Frozen &amp; Stable):</text>
    <text x="25" y="70" fill="#94a3b8" font-family="monospace" font-size="11">Fall, Fight, Fire, SOS Panic, Face</text>
    <text x="15" y="92" fill="#e2e8f0" font-family="sans-serif" font-size="11">Vehicle ANPR &amp; Fusion:</text>
    <text x="25" y="110" fill="#34d399" font-family="monospace" font-size="11">w = ocr_conf × img_quality</text>
    <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="11">Weighted Argmax &amp; Indian Syntax Regex</text>
  </g>

  <!-- ROW 2: PERSISTENCE & API -->
  <!-- Box 4: SQLite Database -->
  <g transform="translate(40, 300)">
    <rect width="450" height="170" rx="10" fill="url(#boxGrad1)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="450" height="32" rx="10" fill="#4338ca" fill-opacity="0.3"/>
    <text x="15" y="22" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. SQLITE PERSISTENCE LAYER (emergency_ai.db)</text>
    <text x="15" y="55" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Existing Unaltered Tables:</text>
    <text x="25" y="75" fill="#94a3b8" font-family="monospace" font-size="11">• incidents (id, timestamp, type, confidence, details)</text>
    <text x="25" y="93" fill="#94a3b8" font-family="monospace" font-size="11">• cameras (9 registered grid nodes), camera_zones</text>
    <text x="15" y="115" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">New Intelligence Table:</text>
    <text x="25" y="135" fill="#38bdf8" font-family="monospace" font-size="11">• vehicle_sightings (id, camera_id, plate_number, confidence,</text>
    <text x="35" y="152" fill="#38bdf8" font-family="monospace" font-size="11">   timestamp, pts_ms, snapshot_path, track_key)</text>
  </g>

  <!-- Box 5: FastAPI Backend & Engine -->
  <g transform="translate(530, 300)">
    <rect width="530" height="170" rx="10" fill="url(#boxGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="530" height="32" rx="10" fill="#0284c7" fill-opacity="0.3"/>
    <text x="15" y="22" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">5. FASTAPI BACKEND SERVICES &amp; INTELLIGENCE ENGINE</text>
    <text x="15" y="55" fill="#e2e8f0" font-family="monospace" font-size="12">GET /journey/{plate}</text>
    <text x="25" y="73" fill="#94a3b8" font-family="sans-serif" font-size="11">Chronological sightings + Haversine distance + speed km/h.</text>
    <text x="25" y="90" fill="#10b981" font-family="sans-serif" font-size="11">Feasibility validation: ≤ 150 km/h = True | &gt; 150 km/h = False (teleportation flag)</text>
    <text x="15" y="112" fill="#e2e8f0" font-family="monospace" font-size="12">GET /correlations/{incident_id}</text>
    <text x="25" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">Auto-resolves incident camera; filters sightings within ±2 min (±120s) window.</text>
    <text x="15" y="152" fill="#e2e8f0" font-family="monospace" font-size="11">GET /health, /cameras, /alerts (Watchlist hits integrated with confidence 1.0)</text>
  </g>

  <!-- ROW 3: FRONTEND DASHBOARD -->
  <!-- Box 6: Operator Command Dashboard -->
  <g transform="translate(40, 500)">
    <rect width="1020" height="145" rx="10" fill="url(#boxGrad1)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="1020" height="32" rx="10" fill="#047857" fill-opacity="0.3"/>
    <text x="15" y="22" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">6. OPERATOR COMMAND DASHBOARD (frontend/index.html &amp; app.js)</text>
    
    <!-- Sub-feature A: Alerts & SOP -->
    <g transform="translate(20, 45)">
      <rect width="310" height="85" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <text x="12" y="22" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LIVE ALERTS &amp; SOP DISPATCH</text>
      <text x="12" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Priority Watchlist Vehicle Badge</text>
      <text x="12" y="58" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Inline SOP Response Advisory Card</text>
      <text x="12" y="74" fill="#38bdf8" font-family="sans-serif" font-size="11">• One-Click "Track Journey" trigger</text>
    </g>

    <!-- Sub-feature B: Interactive Map -->
    <g transform="translate(355, 45)">
      <rect width="310" height="85" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LEAFLET CROSS-CAMERA MAP</text>
      <text x="12" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Sentinel Gandhinagar/Ahmedabad Grid</text>
      <text x="12" y="58" fill="#10b981" font-family="sans-serif" font-size="11">• Green Solid = Kinematically Feasible</text>
      <text x="12" y="74" fill="#ef4444" font-family="sans-serif" font-size="11">• Red Dashed = Impossible Speed Hop</text>
    </g>

    <!-- Sub-feature C: Timeline & Correlator -->
    <g transform="translate(690, 45)">
      <rect width="310" height="85" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SPATIAL-TEMPORAL TIMELINE</text>
      <text x="12" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Chronological vehicle sightings sequence</text>
      <text x="12" y="58" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Elapsed time &amp; required hop speed</text>
      <text x="12" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">• ±2 min Incident correlation explorer</text>
    </g>
  </g>

  <!-- Connectors -->
  <!-- Box 1 to Box 2 -->
  <line x1="340" y1="185" x2="385" y2="185" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 2 to Box 3 -->
  <line x1="710" y1="185" x2="755" y2="185" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 3 to DB -->
  <path d="M 850 260 L 850 280 L 265 280 L 265 295" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DB to FastAPI -->
  <line x1="490" y1="385" x2="525" y2="385" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- FastAPI to Dashboard -->
  <path d="M 795 470 L 795 485 L 550 485 L 550 495" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
</svg>
